spring:
  application:
    name: be-gems
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:begems}
    username: ${DB_USER:begems}
    password: ${DB_PASSWORD:begems}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-production-please-change-me-begems}
  expiration-minutes: 480

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5175}
  frontend-url: ${FRONTEND_URL:http://localhost:5175}
  mail:
    # log | brevo | smtp. Render's free tier blocks outbound SMTP, so production uses Brevo's HTTP API.
    provider: ${MAIL_PROVIDER:log}
    brevo-api-key: ${BREVO_API_KEY:}
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:BE-GEMS}
  notifications:
    overdue-digest-cron: ${OVERDUE_DIGEST_CRON:0 0 8 * * MON-FRI}

server:
  port: ${PORT:8081}
