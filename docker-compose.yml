services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: begems
      POSTGRES_USER: begems
      POSTGRES_PASSWORD: begems
    ports:
      - "5434:5432"
    volumes:
      - begems_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: begems
      DB_USER: begems
      DB_PASSWORD: begems
      ALLOWED_ORIGINS: http://localhost:5175
      FRONTEND_URL: http://localhost:5175
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081
    ports:
      - "5175:80"
    depends_on:
      - backend

volumes:
  begems_pgdata:
